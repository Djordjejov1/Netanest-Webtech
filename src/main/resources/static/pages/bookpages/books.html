<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeatNest – Books</title>
    <link rel="stylesheet" href="/css/books.css">
</head>
<body>

<nav>
    <h1>NeatNest</h1>
    <div class="nav-right">
        <span id="welcomeText"></span>
        <button onclick="window.location.href='/pages/home.html'">Home</button>
        <button onclick="logout()">Abmelden</button>
    </div>
</nav>

<div class="container">

    <div class="card">
        <h2>Buch suchen </h2>
        <input type="text" id="searchInput" placeholder="Buchtitel oder Autor suchen..." />
        <button onclick="searchBooks()">Suchen</button>
        <div id="searchResults"></div>
    </div>

    <div class="card">
        <h2>Meine Bücher</h2>
        <div class="filter-bar">
            <select id="sortSelect" onchange="applySortFilter()">
                <option value="default">Standard</option>
                <option value="alpha-asc">A → Z</option>
                <option value="alpha-desc">Z → A</option>
                <option value="author-asc">Autor A → Z</option>
                <option value="author-desc">Autor Z → A</option>
                <option value="year-asc">Älteste zuerst</option>
                <option value="year-desc">Neueste zuerst</option>
            </select>
        </div>
        <div id="booksList"></div>
    </div>


    <div id="bookModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <img id="modalCover" src="" alt="Cover">
                <h2 id="modalTitle"></h2>
            </div>
            <div id="modalInfo"></div>
            <div class="modal-buttons">
                <button onclick="editBook()">Bearbeiten</button>
                <button onclick="closeModal()">Schließen</button>
                <button class="fav-btn" onclick="addToFavorites()">⭐ Favorit</button>
            </div>
        </div>
    </div>

</div>

<script src="/js/pages/bookpages/book.js"></script>
</body>
</html>
