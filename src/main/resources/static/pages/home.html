<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeatNest – Home</title>
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>

<nav>
    <h1>NeatNest</h1>
    <div class="nav-right">
        <span id="welcomeText"></span>

        <div class="menu-wrapper">
            <button class="menu-toggle" onclick="toggleUserMenu()">☰</button>
            <div class="user-menu" id="userMenu">
                <button onclick="openAccountInfo()">Account Info</button>
                <button onclick="openSettings()">Settings</button>
                <button onclick="logout()">Abmelden</button>
            </div>
        </div>
    </div>
</nav>

<div class="container">

    <div class="top-icons">
        <div class="category-card" onclick="window.location.href='/pages/moviespages/movies.html'">
            <div class="icon">🍿</div>
            <h2>Movies</h2>
        </div>
        <div class="category-card" onclick="window.location.href='/pages/songpages/songs.html'">
            <div class="icon">🎧</div>
            <h2>Songs</h2>
        </div>
        <div class="category-card" onclick="window.location.href='/pages/bookpages/books.html'">
            <div class="icon">📖</div>
            <h2>Books</h2>
        </div>
    </div>

    <div class="favorites-section">
        <div class="favorites-header">
            <h2>⭐ Favorites</h2>
            <input type="text" placeholder="Search favorites..." oninput="filterFavorites()">
        </div>
        <div class="favorites-box">
            <div id="favoritesList"></div>
        </div>
    </div>

</div>

<script src="/js/pages/home.js"></script>
<footer>
    <p>NeatNest © 2026</p>
    <p>Projektmitglieder: Djordje Jovanovic, Adila Huseynzade, Mohamed Chrigui, Sümeyye Merve Özmen</p>
</footer>
</body>
</html>
