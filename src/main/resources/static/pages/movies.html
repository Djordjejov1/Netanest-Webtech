<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeatNest – Movies</title>
    <link rel="stylesheet" href="/css/movies.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
    <h1>NeatNest</h1>
    <div class="nav-right">
        <span id="welcomeText"></span>
        <button onclick="window.location.href='/pages/home.html'">Home</button>
        <button onclick="logout()">Abmelden</button>
    </div>
</nav>

<!-- HAUPTINHALT -->
<div class="container">

    <!-- FILM HINZUFÜGEN -->
    <div class="card">
        <h2>Film hinzufügen</h2>
        <input type="text" id="searchInput" placeholder="Film suchen (OMDB)..." />
        <button onclick="searchOMDB()">Suchen</button>

        <!-- OMDB Suchergebnisse -->
        <div id="searchResults"></div>
    </div>

    <!-- MEINE FILME -->
    <div class="card">
        <h2>Meine Filme</h2>
        <input type="text" id="filterInput" placeholder="Filtern..." oninput="filterMovies()" />
        <div id="moviesList"></div>
    </div>

<!-- MODAL -->
<div id="movieModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <img id="modalPoster" src="" alt="Poster" />
            <h2 id="modalTitle"></h2>
        </div>
        <div id="modalInfo"></div>
        <div class="modal-buttons">
            <button onclick="editMovie()">Bearbeiten</button>
            <button onclick="closeModal()">Schließen</button>
        </div>
    </div>
</div>

<script src="/js/pages/movies.js"></script>
</body>
</html>
