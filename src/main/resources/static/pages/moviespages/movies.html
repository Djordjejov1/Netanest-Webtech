<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeatNest – Movies</title>
    <link rel="stylesheet" href="/css/movies.css">
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
    <h1>NeatNest</h1>
    <div class="nav-right">
        <span id="welcomeText"></span>
        <button onclick="window.location.href='/pages/home.html'">Home</button>
        <!-- I use this wrapper to keep the profile menu positioned inside the navbar. -->
        <div class="menu-wrapper">
            <button class="menu-toggle" onclick="toggleUserMenu(event)">&#9776;</button>
            <!-- I keep account actions inside this dropdown menu. -->
            <div class="user-menu" id="userMenu">
                <button onclick="openAccountInfo()">Account Info</button>
                <button onclick="logout()">Abmelden</button>
            </div>
        </div>
    </div>
</nav>

<!-- HAUPTINHALT -->
<div class="container">

    <!-- FILM HINZUFÜGEN -->
    <div class="card">
        <h2>Film hinzufügen</h2>
        <input type="text" id="searchInput" placeholder="Film suchen (OMDB)..." />
        <button onclick="searchOMDB()">Suchen</button>

        <!-- OMDB Suchergebnisse -->
        <div id="searchResults"></div>
    </div>

    <!-- MEINE FILME -->
    <div class="card">
        <h2>Meine Filme</h2>
        <div class="filter-bar">
            <select id="sortSelect" onchange="applySortFilter()">
                <option value="default">Standard</option>
                <option value="alpha-asc">A → Z</option>
                <option value="alpha-desc">Z → A</option>
                <option value="year-asc">Jahr ↑</option>
                <option value="year-desc">Jahr ↓</option>
                <option value="rating-desc">Beste Bewertung</option>
                <option value="rating-asc">Schlechteste Bewertung</option>
                <option value="runtime-asc">Kürzeste Laufzeit</option>
                <option value="runtime-desc">Längste Laufzeit</option>
            </select>
        </div>
        <div id="moviesList"></div>
    </div>

    <!-- MODAL -->
    <div id="movieModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <img id="modalPoster" src="" alt="Poster" />
                <h2 id="modalTitle"></h2>
            </div>
            <div id="modalInfo"></div>
            <div class="modal-buttons">
                <button onclick="editMovie()">Bearbeiten</button>
                <button onclick="closeModal()">Schließen</button>
                <button class="fav-btn" onclick="addToFavorites()">⭐ Favorit</button>
            </div>
        </div>
    </div>
</div>


<div id="toastContainer" class="toast-container"></div>

<script src="/js/pages/menu.js?v=5"></script>
<script src="/js/pages/toast.js"></script>
<script src="/js/pages/moviepages/movies.js"></script>
</body>
</html>
