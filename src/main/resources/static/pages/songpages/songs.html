<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeatNest – Songs</title>
    <link rel="stylesheet" href="/css/songs.css">
</head>
<body>
<nav>
    <h1>NeatNest</h1>
    <div class="nav-right">
        <span id="welcomeText"></span>
        <button onclick="window.location.href='/pages/home.html'">Home</button>
        <div class="menu-wrapper">
            <button class="menu-toggle" onclick="toggleUserMenu()">☰</button>
            <div class="user-menu" id="userMenu">
                <button onclick="window.location.href='/pages/account.html'">Account Info</button>
                <button onclick="logout()">Abmelden</button>
            </div>
        </div>
    </div>
</nav>

<div class="container">

    <div class="card">
        <h2>Song hinzufügen</h2>
        <input type="text" id="searchInput" placeholder="Song oder Artist suchen..." />
        <button onclick="searchSongs()">Suchen</button>
        <div id="searchResults"></div>
    </div>

    <div class="card">
        <h2>Meine Songs</h2>
        <div class="filter-bar">
            <select id="sortSelect" onchange="applySortFilter()">
                <option value="default">Standard</option>
                <option value="alpha-asc">A → Z</option>
                <option value="alpha-desc">Z → A</option>
                <option value="artist-asc">Artist A → Z</option>
                <option value="artist-desc">Artist Z → A</option>
                <option value="date-asc">Älteste zuerst</option>
                <option value="date-desc">Neueste zuerst</option>
                <option value="duration-asc">Kürzeste zuerst</option>
                <option value="duration-desc">Längste zuerst</option>
            </select>
        </div>
        <div id="songsList"></div>
    </div>

    <div id="songModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <img id="modalCover" src="" alt="Cover">
                <h2 id="modalTitle"></h2>
            </div>
            <div id="modalInfo"></div>
            <div class="modal-buttons">
                <button onclick="editSong()">Bearbeiten</button>
                <button onclick="closeModal()">Schließen</button>
                <button class="fav-btn" onclick="addToFavorites()">⭐ Favorit</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/pages/songpages/songs.js"></script>
</body>
</html>
